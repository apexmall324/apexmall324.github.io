<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product | Apexmall</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="header">

    <a
        href="index.html"
        class="logo"
    >
        Apexmall
    </a>


    <nav class="navigation">

        <a href="shop.html">
            Shop
        </a>

        <a href="index.html#categories">
            Categories
        </a>

        <a href="index.html#about">
            About
        </a>

    </nav>


    <div class="header-actions">

        <a
            href="cart.html"
            class="cart"
        >

            Cart

            <span id="cart-count">
                0
            </span>

        </a>

    </div>

</header>



<main>


    <section class="product-page">

        <div id="product-detail">

            <!-- JavaScript loads product here -->

        </div>

    </section>



    <!-- RELATED PRODUCTS -->

    <section class="section">

        <div class="section-heading">

            <div>

                <p class="eyebrow">
                    YOU MAY ALSO LIKE
                </p>

                <h2>
                    Related products
                </h2>

            </div>

        </div>


        <div
            id="related-products"
            class="products"
        ></div>

    </section>

</main>



<footer class="footer">

    <div class="footer-brand">

        <h3>
            Apexmall
        </h3>

        <p>
            Quality products.
            Exceptional experience.
        </p>

    </div>

</footer>



<script
    type="module"
    src="js/product.js"
></script>


</body>

</html>
